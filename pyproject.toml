[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digiwebscape"
version = "0.16.13"
description = "Official Python SDK for DigiWebscape Platform (AI Visibility, Telemetry, Webhooks & MCP)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hitender Sharma (DigiWebscape)", email = "support@digiwebscape.com" }
]
keywords = ["digiwebscape", "ai-visibility", "telemetry", "webhooks", "mcp", "agentic-commerce"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://digiwebscape.com"
Documentation = "https://digiwebscape.com/platform/developers"
Repository = "https://github.com/DigiWebscape/python-sdk"
Issues = "https://github.com/DigiWebscape/python-sdk/issues"
